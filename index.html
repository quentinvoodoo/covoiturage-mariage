<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
  const app = initializeApp({
    apiKey: "AIzaSyAx9XZSbxDwZ8ODQ5glaR5PWNoHUTuz9Dk",
    authDomain: "mariage-bq.firebaseapp.com",
    databaseURL: "https://mariage-bq-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mariage-bq",
    storageBucket: "mariage-bq.firebasestorage.app",
    messagingSenderId: "541259077291",
    appId: "1:541259077291:web:6f806dc0677faa975d49ee"
  });
  const db = getDatabase(app);
  window.__fb = {
    push:    (path, data) => push(ref(db, path), data),
    remove:  (path)       => remove(ref(db, path)),
    update:  (path, data) => update(ref(db, path), data),
    onValue: (path, cb)   => onValue(ref(db, path), cb),
  };

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fdf8f2; font-family:Georgia,serif; color:#3a2a1a; }
  .date-time-row { display:flex; gap:12px; }
  .date-time-row > div { flex:1; min-width:0; }
  .date-time-row input { width:100%; min-width:0; min-height:44px; -webkit-appearance:none; appearance:none; }
  @media (max-width:500px) { .date-time-row { flex-direction:column; gap:0; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const P = {
  bg:"#fdf8f2", primary:"#C0603A", accent:"#D4845E", light:"#fbeee8",
  border:"#e8cfc0", text:"#3a2a1a", muted:"#9e8070", green:"#5a8a5a",
  greenLight:"#e8f5e8", red:"#c0392b", redLight:"#fde8e8",
  blue:"#3a6ea5", blueLight:"#e8f0fb",
};

const s = {
  app:     { minHeight:"100vh", background:P.bg, fontFamily:"Georgia,serif", color:P.text },
  header:  { background:"linear-gradient(135deg,#C0603A,#D4845E)", color:"#fff", textAlign:"center", padding:"32px 20px 24px" },
  hTitle:  { fontSize:22, fontWeight:"bold", margin:0, letterSpacing:.5 },
  hSub:    { fontSize:13, marginTop:6, opacity:.85 },
  tabs:    { display:"flex", background:"#fff", borderBottom:"2px solid "+P.border },
  tab:  a  => ({ flex:1, padding:"13px 6px", border:"none", background:a?P.light:"#fff", color:a?P.primary:P.muted, fontWeight:a?"bold":"normal", fontSize:14, cursor:"pointer", borderBottom:a?"3px solid "+P.primary:"3px solid transparent", fontFamily:"Georgia,serif" }),
  body:    { maxWidth:600, margin:"0 auto", padding:"20px 16px" },
  card:    { background:"#fff", borderRadius:12, border:"1px solid "+P.border, padding:20, marginBottom:16, boxShadow:"0 2px 8px rgba(192,96,58,.07)" },
  cTitle:  { fontSize:16, fontWeight:"bold", color:P.primary, marginBottom:14 },
  label:   { display:"block", fontSize:13, color:P.muted, marginBottom:4, marginTop:12 },
  input:   { width:"100%", padding:"10px 12px", borderRadius:8, border:"1px solid "+P.border, fontSize:15, fontFamily:"Georgia,serif", background:P.bg, color:P.text, boxSizing:"border-box" },
  row:     { display:"flex", gap:12 },
  btn:  c  => ({ background:c||P.primary, color:"#fff", border:"none", borderRadius:8, padding:"12px 20px", fontSize:15, cursor:"pointer", fontFamily:"Georgia,serif", fontWeight:"bold", width:"100%", marginTop:16 }),
  badge:(bg,tc) => ({ background:bg, color:tc, borderRadius:20, padding:"3px 10px", fontSize:12, fontWeight:"bold", whiteSpace:"nowrap" }),
  dCard:   { background:"#fff", borderRadius:12, border:"1px solid "+P.border, padding:16, marginBottom:12 },
  dName:   { fontWeight:"bold", fontSize:16, color:P.primary },
  dInfo:   { fontSize:13, color:P.muted, marginTop:3 },
  aBtn: (bg,tc,bc) => ({ background:bg, color:tc, border:"1px solid "+bc, borderRadius:8, padding:"8px 14px", fontSize:13, cursor:"pointer", fontFamily:"Georgia,serif", fontWeight:"bold", marginTop:10, marginRight:8 }),
  empty:   { textAlign:"center", color:P.muted, padding:"40px 20px", fontSize:15 },
  ok:      { background:P.greenLight, color:P.green, borderRadius:8, padding:"12px 16px", fontSize:14, marginTop:12, textAlign:"center", fontWeight:"bold" },
  err:     { background:P.redLight, color:P.red, borderRadius:8, padding:"10px 14px", fontSize:13, marginTop:10, textAlign:"center" },
  chip:    { display:"inline-block", background:P.light, borderRadius:20, padding:"2px 10px", fontSize:12, color:P.primary, marginRight:6, marginTop:4 },
  tRow:    { display:"flex", gap:10, marginTop:12 },
  tBtn: (a,c) => ({ flex:1, padding:"10px 8px", borderRadius:8, border:"2px solid "+(a?c:P.border), background:a?c+"22":"#fff", color:a?c:P.muted, fontWeight:a?"bold":"normal", fontSize:14, cursor:"pointer", fontFamily:"Georgia,serif" }),
  fRow:    { display:"flex", gap:8, marginBottom:16, flexWrap:"wrap" },
  fChip: a => ({ padding:"6px 14px", borderRadius:20, border:"1px solid "+(a?P.primary:P.border), background:a?P.primary:"#fff", color:a?"#fff":P.muted, fontSize:13, cursor:"pointer", fontFamily:"Georgia,serif" }),
  loader:  { textAlign:"center", padding:"40px 20px", color:P.muted, fontSize:15 },
  hint:    { fontSize:12, color:P.muted, marginTop:6, fontStyle:"italic" },
  overlay: { position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", padding:16 },
  modal:   { background:"#fff", borderRadius:16, padding:24, width:"100%", maxWidth:420, boxShadow:"0 8px 32px rgba(0,0,0,.18)", maxHeight:"90vh", overflowY:"auto" },
  mTitle:  { fontWeight:"bold", fontSize:17, marginBottom:12 },
  info:    { background:P.light, border:"1px solid "+P.border, borderRadius:8, padding:"10px 14px", fontSize:13, color:P.muted, marginBottom:16, lineHeight:1.5 },
};

const EyeIcon = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
);
const EyeOffIcon = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
  </svg>
);

function PinInput({ value, onChange, placeholder }) {
  const [show, setShow] = useState(false);
  return (
    <div style={{position:"relative"}}>
      <input
        style={{...s.input, paddingRight:44}}
        value={value}
        onChange={onChange}
        type={show?"text":"password"}
        placeholder={placeholder||"Votre code secret"}
      />
      <button
        onClick={() => setShow(v => !v)}
        style={{position:"absolute", right:10, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", cursor:"pointer", color:P.muted, padding:4, display:"flex", alignItems:"center"}}
        type="button"
      >
        {show ? <EyeOffIcon/> : <EyeIcon/>}
      </button>
    </div>
  );
}

const fmtDate = d => {
  if (!d) return "";
  const [y,m,day] = d.split("-");
  return day+"/"+m+"/"+y;
};
const phoneFilter = e => e.target.value.replace(/[^\d+]/g, "");

/* ── Champs de formulaire partagés ── */
function TripFields({ f, set }) {
  return (
    <div>
      <label style={s.label}>Trajet *</label>
      <div style={s.tRow}>
        <button style={s.tBtn(f.direction==="aller", P.primary)} onClick={() => set("direction")({target:{value:"aller"}})}>{"➡️ Aller"}</button>
        <button style={s.tBtn(f.direction==="retour", P.accent)}  onClick={() => set("direction")({target:{value:"retour"}})}>{"⬅️ Retour"}</button>
      </div>
      <label style={s.label}>Prénom et nom *</label>
      <input style={s.input} value={f.name}  onChange={set("name")}  placeholder="ex : Marie Dupont"/>
      <label style={s.label}>Téléphone *</label>
      <input style={s.input} value={f.phone} onChange={e => set("phone")({target:{value:phoneFilter(e)}})} placeholder="ex : 0612345678" type="tel"/>
      <label style={s.label}>Lieu de départ *</label>
      <input style={s.input} value={f.from}  onChange={set("from")}  placeholder={f.direction==="aller"?"ex : Paris 15e, Versailles...":"ex : Salle des fêtes"}/>
      <label style={s.label}>Lieu d'arrivée *</label>
      <input style={s.input} value={f.to}    onChange={set("to")}    placeholder={f.direction==="aller"?"ex : Salle des fêtes":"ex : Paris 15e, Versailles..."}/>
      <div className="date-time-row">
        <div>
          <label style={s.label}>Date *</label>
          <input style={s.input} value={f.date} onChange={set("date")} type="date"/>
        </div>
        <div>
          <label style={s.label}>Heure *</label>
          <input style={s.input} value={f.time} onChange={set("time")} type="time"/>
        </div>
      </div>
      <label style={s.label}>Places disponibles</label>
      <select style={s.input} value={f.seats} onChange={set("seats")}>
        {[1,2,3,4,5,6,7].map(n => <option key={n} value={n}>{n} place{n>1?"s":""}</option>)}
      </select>
      <label style={s.label}>Note (optionnel)</label>
      <input style={s.input} value={f.note} onChange={set("note")} placeholder="ex : Je passe par Versailles"/>
    </div>
  );
}

/* ── Ajout d'un trajet ── */
const EMPTY = { name:"", phone:"", from:"", to:"", date:"", time:"", seats:"3", note:"", direction:"aller" };

function AddTripCard({ onAdd }) {
  const [f, setF]       = useState(EMPTY);
  const [pin, setPin]   = useState("");
  const [ok, setOk]     = useState(false);
  const [loading, setL] = useState(false);
  const set = k => e => setF(p => ({...p, [k]:e.target.value}));

  const submit = async () => {
    if (!f.name||!f.phone||!f.from||!f.to||!f.date||!f.time||!pin) return alert("Merci de remplir tous les champs obligatoires.");
    if (pin.length < 4) return alert("Le code secret doit faire au moins 4 caractères.");
    setL(true);
    try {
      await window.__fb.push("drivers", {...f, pin, passengers:{}});
      setF(EMPTY); setPin(""); setOk(true); setTimeout(()=>setOk(false),3000); onAdd();
    } catch(e) { alert("Erreur lors de l'enregistrement. Réessayez."); }
    setL(false);
  };

  return (
    <div style={s.card}>
      <div style={s.cTitle}>🚗 Je propose un trajet</div>
      <TripFields f={f} set={set}/>
      <label style={s.label}>Code secret * <span style={{fontWeight:"normal"}}>(pour modifier ou supprimer votre trajet)</span></label>
      <PinInput value={pin} onChange={e=>setPin(e.target.value)} placeholder="ex : 1234 ou votre prénom"/>
      <div style={s.hint}>⚠️ Notez-le bien, il ne pourra pas être récupéré.</div>
      <button style={s.btn()} onClick={submit} disabled={loading}>{loading?"Enregistrement...":"✦ Proposer ce trajet"}</button>
      {ok && <div style={s.ok}>🎉 Votre trajet a bien été ajouté !</div>}
    </div>
  );
}

/* ── Rejoindre ── */
function JoinModal({ driver, onClose }) {
  const [name, setName]   = useState("");
  const [phone, setPhone] = useState("");
  const [ok, setOk]       = useState(false);
  const [loading, setL]   = useState(false);
  const paxCount = Object.keys(driver.passengers||{}).length;
  const avail    = driver.seats - paxCount;
  const isAller  = driver.direction !== "retour";
  const dc       = isAller ? P.primary : P.accent;

  const submit = async () => {
    if (!name||!phone) return alert("Merci de remplir votre nom et téléphone.");
    setL(true);
    try {
      await window.__fb.push("drivers/"+driver.id+"/passengers", {name, phone});
      setOk(true); setTimeout(onClose, 2500);
    } catch(e) { alert("Erreur. Réessayez."); }
    setL(false);
  };

  return (
    <div style={s.overlay}>
      <div style={s.modal}>
        <div style={{...s.mTitle, color:dc}}>{isAller?"➡️ Aller":"⬅️ Retour"} — trajet de {driver.name}</div>
        <div style={{fontSize:13, color:P.muted, marginBottom:16}}>
          {"📅 "+fmtDate(driver.date)+" à "+driver.time+" · 📍 "+driver.from+" · "+avail+" place"+(avail>1?"s":"")+" restante"+(avail>1?"s":"")}
        </div>
        <label style={s.label}>Votre prénom et nom *</label>
        <input style={s.input} value={name} onChange={e=>setName(e.target.value)} placeholder="ex : Jean Martin"/>
        <label style={s.label}>Votre téléphone *</label>
        <input style={s.input} value={phone} onChange={e=>setPhone(phoneFilter(e))} placeholder="ex : 0698765432" type="tel"/>
        {ok
          ? <div style={s.ok}>{"✅ C'est noté ! Contactez "+driver.name+" au "+driver.phone+" pour confirmer."}</div>
          : <div style={s.row}>
              <button style={{...s.btn(P.muted), marginTop:16}} onClick={onClose}>Annuler</button>
              <button style={s.btn(P.green)} onClick={submit} disabled={loading}>{loading?"...":"✦ Confirmer"}</button>
            </div>
        }
      </div>
    </div>
  );
}

/* ── Se retirer ── */
function LeaveModal({ driver, onClose }) {
  const [phone, setPhone] = useState("");
  const [err, setErr]     = useState("");
  const [loading, setL]   = useState(false);

  const submit = async () => {
    const pax   = driver.passengers || {};
    const match = Object.entries(pax).find(([,v]) => v.phone.replace(/\s/g,"") === phone.replace(/\s/g,""));
    if (!match) { setErr("Numéro introuvable dans ce trajet. Vérifiez votre numéro."); return; }
    setL(true);
    try {
      await window.__fb.remove("drivers/"+driver.id+"/passengers/"+match[0]);
      onClose(true);
    } catch(e) { setErr("Erreur. Réessayez."); }
    setL(false);
  };

  return (
    <div style={s.overlay}>
      <div style={s.modal}>
        <div style={{...s.mTitle, color:P.red}}>🚪 Se retirer du trajet</div>
        <div style={s.info}>
          💡 Si vous avez rejoint ce trajet et souhaitez vous désinscrire, entrez votre numéro de téléphone ci-dessous tel que vous l'avez saisi lors de votre inscription.
        </div>
        <label style={s.label}>Votre numéro de téléphone *</label>
        <input style={s.input} value={phone} onChange={e=>{setPhone(phoneFilter(e));setErr("");}} placeholder="ex : 0698765432" type="tel"/>
        {err && <div style={s.err}>{err}</div>}
        <div style={s.row}>
          <button style={{...s.btn(P.muted), marginTop:16}} onClick={()=>onClose(false)}>Annuler</button>
          <button style={s.btn(P.red)} onClick={submit} disabled={loading}>{loading?"...":"🚪 Me retirer"}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Voir les passagers (conducteur) ── */
function PaxModal({ driver, onClose }) {
  const [pin, setPin]         = useState("");
  const [err, setErr]         = useState("");
  const [unlocked, setUnlock] = useState(false);
  const paxList = Object.values(driver.passengers||{});

  const confirm = () => {
    if (pin !== driver.pin) { setErr("Code secret incorrect."); return; }
    setUnlock(true);
  };

  return (
    <div style={s.overlay}>
      <div style={s.modal}>
        <div style={{...s.mTitle, color:P.primary}}>👥 Passagers inscrits</div>
        {!unlocked
          ? <>
              <div style={{fontSize:13, color:P.muted, marginBottom:12}}>Entrez votre code secret pour voir les numéros de vos passagers.</div>
              <PinInput value={pin} onChange={e=>{setPin(e.target.value);setErr("");}}/>
              {err && <div style={s.err}>{err}</div>}
              <div style={s.row}>
                <button style={{...s.btn(P.muted), marginTop:16}} onClick={onClose}>Fermer</button>
                <button style={s.btn(P.primary)} onClick={confirm}>🔓 Voir les numéros</button>
              </div>
            </>
          : <>
              {paxList.map((p,i) => (
                <div key={i} style={{padding:"10px 0", borderBottom:i<paxList.length-1?"1px solid "+P.border:"none"}}>
                  <div style={{fontWeight:"bold", color:P.text}}>{"👤 "+p.name}</div>
                  <a href={"tel:"+p.phone} style={{color:P.primary, fontSize:14, textDecoration:"none"}}>{"📞 "+p.phone}</a>
                </div>
              ))}
              <button style={s.btn(P.muted)} onClick={onClose}>Fermer</button>
            </>
        }
      </div>
    </div>
  );
}

/* ── Modifier ── */
function EditModal({ driver, onClose }) {
  const [f, setF] = useState({ name:driver.name, phone:driver.phone, from:driver.from, to:driver.to||"", date:driver.date, time:driver.time, seats:String(driver.seats), note:driver.note||"", direction:driver.direction });
  const [pin, setPin]   = useState("");
  const [err, setErr]   = useState("");
  const [loading, setL] = useState(false);
  const set = k => e => setF(p => ({...p, [k]:e.target.value}));

  const submit = async () => {
    if (pin !== driver.pin) { setErr("Code secret incorrect."); return; }
    if (!f.name||!f.phone||!f.from||!f.date||!f.time) { setErr("Merci de remplir tous les champs."); return; }
    const paxCount = Object.keys(driver.passengers||{}).length;
    const newSeats = parseInt(f.seats);
    if (paxCount > newSeats) {
      const names = Object.values(driver.passengers||{}).map(p=>p.name).join(", ");
      const go = window.confirm("⚠️ Vous réduisez les places à "+newSeats+" alors que "+paxCount+" passager"+(paxCount>1?"s sont":"est")+" déjà inscrit"+(paxCount>1?"s":"")+".\n\n👤 "+names+"\n\nPensez à les contacter. Voulez-vous quand même enregistrer ?");
      if (!go) return;
    }
    setL(true);
    try {
      await window.__fb.update("drivers/"+driver.id, {...f, pin:driver.pin, passengers:driver.passengers||{}});
      onClose(true);
    } catch(e) { setErr("Erreur. Réessayez."); }
    setL(false);
  };

  return (
    <div style={s.overlay}>
      <div style={s.modal}>
        <div style={{...s.mTitle, color:P.blue}}>✏️ Modifier mon trajet</div>
        <TripFields f={f} set={set}/>
        <label style={s.label}>Votre code secret *</label>
        <PinInput value={pin} onChange={e=>{setPin(e.target.value);setErr("");}}/>
        {err && <div style={s.err}>{err}</div>}
        <div style={s.row}>
          <button style={{...s.btn(P.muted), marginTop:16}} onClick={()=>onClose(false)}>Annuler</button>
          <button style={s.btn(P.blue)} onClick={submit} disabled={loading}>{loading?"...":"✏️ Enregistrer"}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Supprimer ── */
function DeleteModal({ driver, onClose }) {
  const [pin, setPin]   = useState("");
  const [err, setErr]   = useState("");
  const [loading, setL] = useState(false);

  const submit = async () => {
    if (pin !== driver.pin) { setErr("Code secret incorrect."); return; }
    const paxCount = Object.keys(driver.passengers||{}).length;
    if (paxCount > 0) {
      const names = Object.values(driver.passengers||{}).map(p=>p.name).join(", ");
      const go = window.confirm("⚠️ "+paxCount+" passager"+(paxCount>1?"s sont":"est")+" inscrit"+(paxCount>1?"s":"")+" sur ce trajet.\n\n👤 "+names+"\n\nIls devront trouver une autre solution. Voulez-vous quand même supprimer ?");
      if (!go) return;
    }
    setL(true);
    try {
      await window.__fb.remove("drivers/"+driver.id);
      onClose(true);
    } catch(e) { setErr("Erreur. Réessayez."); }
    setL(false);
  };

  return (
    <div style={s.overlay}>
      <div style={s.modal}>
        <div style={{...s.mTitle, color:P.red}}>🗑 Supprimer ce trajet ?</div>
        <div style={{fontSize:13, color:P.muted, marginBottom:8}}>
          {"Trajet de "+driver.name+" — "+fmtDate(driver.date)+" à "+driver.time}
        </div>
        <div style={{fontSize:13, color:P.red, marginBottom:12}}>⚠️ Cette action est irréversible.</div>
        <label style={s.label}>Votre code secret *</label>
        <PinInput value={pin} onChange={e=>{setPin(e.target.value);setErr("");}}/>
        {err && <div style={s.err}>{err}</div>}
        <div style={s.row}>
          <button style={{...s.btn(P.muted), marginTop:16}} onClick={()=>onClose(false)}>Annuler</button>
          <button style={s.btn(P.red)} onClick={submit} disabled={loading}>{loading?"...":"🗑 Supprimer"}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Liste des trajets ── */
function RideList({ drivers, loading }) {
  const [joinModal,   setJoin]   = useState(null);
  const [leaveModal,  setLeave]  = useState(null);
  const [paxModal,    setPax]    = useState(null);
  const [editModal,   setEdit]   = useState(null);
  const [deleteModal, setDelete] = useState(null);
  const [filter, setFilter]      = useState("tous");

  const filtered = (drivers||[])
    .filter(d => filter==="tous" || d.direction===filter)
    .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

  if (loading) return <div style={s.loader}>⏳ Chargement des trajets…</div>;

  return (
    <>
      {joinModal   && <JoinModal   driver={joinModal}   onClose={()=>setJoin(null)}/>}
      {leaveModal  && <LeaveModal  driver={leaveModal}  onClose={()=>setLeave(null)}/>}
      {paxModal    && <PaxModal    driver={paxModal}    onClose={()=>setPax(null)}/>}
      {editModal   && <EditModal   driver={editModal}   onClose={()=>setEdit(null)}/>}
      {deleteModal && <DeleteModal driver={deleteModal} onClose={()=>setDelete(null)}/>}

      <div style={s.fRow}>
        {["tous","aller","retour"].map(f => (
          <button key={f} style={s.fChip(filter===f)} onClick={()=>setFilter(f)}>
            {f==="tous"?"🔀 Tous":f==="aller"?"➡️ Aller":"⬅️ Retour"}
          </button>
        ))}
      </div>

      {filtered.length===0
        ? <div style={s.empty}>💐 Aucun trajet disponible.<br/>Soyez le premier à en proposer un !</div>
        : filtered.map(d => {
            const paxCount = Object.keys(d.passengers||{}).length;
            const avail    = d.seats - paxCount;
            const full     = avail <= 0;
            const isAller  = d.direction !== "retour";
            const dc       = isAller ? P.primary : P.accent;
            const paxList  = Object.values(d.passengers||{});
            return (
              <div key={d.id} style={{...s.dCard, borderLeft:"4px solid "+dc}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                      <span style={s.dName}>{d.name}</span>
                      <span style={s.badge(isAller?P.light:"#fdebd8", dc)}>{isAller?"➡️ Aller":"⬅️ Retour"}</span>
                    </div>
                    <div style={s.dInfo}>{"📅 "+fmtDate(d.date)+" à "+d.time}</div>
                    <div style={s.dInfo}>{"📍 Départ : "+d.from}</div>
                    <div style={s.dInfo}>{"🏁 Arrivée : "+(d.to||"—")}</div>
                    {d.note && <div style={s.dInfo}>{"💬 "+d.note}</div>}
                    <div style={s.dInfo}>{"📞 "+d.phone}</div>
                  </div>
                  <span style={s.badge(full?P.redLight:P.greenLight, full?P.red:P.green)}>
                    {full ? "Complet" : avail+" place"+(avail>1?"s":"")+" restante"+(avail>1?"s":"")}
                  </span>
                </div>
                {paxList.length>0 && (
                  <div style={{marginTop:8}}>
                    {paxList.map((p,i) => <span key={i} style={s.chip}>{"👤 "+p.name}</span>)}
                  </div>
                )}
                <div style={{marginTop:4}}>
                  {!full     && <button style={s.aBtn(P.greenLight, P.green,   P.green)}   onClick={()=>setJoin(d)}>✦ Rejoindre</button>}
                  {paxList.length>0 && <button style={s.aBtn(P.light,      P.primary, P.primary)} onClick={()=>setPax(d)}>📞 Passagers</button>}
                  {paxList.length>0 && <button style={s.aBtn(P.redLight,   P.red,     P.red)}     onClick={()=>setLeave(d)}>🚪 Se retirer</button>}
                  <button style={s.aBtn(P.blueLight, P.blue,    P.blue)}    onClick={()=>setEdit(d)}>✏️ Modifier</button>
                  <button style={s.aBtn(P.redLight,  P.red,     P.red)}     onClick={()=>setDelete(d)}>🗑 Supprimer</button>
                </div>
              </div>
            );
          })
      }
    </>
  );
}

/* ── App ── */
function App() {
  const [tab, setTab]         = useState("list");
  const [drivers, setDrivers] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const wait = setInterval(() => {
      if (window.__fb) {
        clearInterval(wait);
        window.__fb.onValue("drivers", snap => {
          const data = snap.val();
          setDrivers(data ? Object.entries(data).map(([id,v]) => ({...v, id})) : []);
          setLoading(false);
        });
      }
    }, 100);
    return () => clearInterval(wait);
  }, []);

  return (
    <div style={s.app}>
      <div style={s.header}>
        <div style={{fontSize:28, marginBottom:8}}>👰‍♀️🤵‍♂️</div>
        <div style={s.hTitle}>Covoiturage Mariage Bérengère et Quentin</div>
        <div style={s.hSub}>9 mai 2026 · Covoiturage entre invités</div>
      </div>
      <div style={s.tabs}>
        <button style={s.tab(tab==="list")}  onClick={()=>setTab("list")}>{"🗺 Trajets ("+drivers.length+")"}</button>
        <button style={s.tab(tab==="offer")} onClick={()=>setTab("offer")}>🚗 Proposer un trajet</button>
      </div>
      <div style={s.body}>
        {tab==="list"  && <RideList drivers={drivers} loading={loading}/>}
        {tab==="offer" && <AddTripCard onAdd={()=>setTab("list")}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
